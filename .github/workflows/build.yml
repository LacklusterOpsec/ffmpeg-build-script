name: Build FFmpeg (macOS, Intel)

# Manual trigger only - this is a long native compile, not something you
# want firing on every push. Run it from the repo's Actions tab ("Run
# workflow"), or: gh workflow run build-macos-ffmpeg.yml
on:
  workflow_dispatch:
    inputs:
      enable_gpl_and_non_free:
        description: "Include GPL / non-free codecs (x264, x265, fdk-aac, ...)"
        type: boolean
        default: true
      disable:
        description: "Comma-separated packages to skip (./build-ffmpeg --list-packages for names)"
        type: string
        default: "lv2"
      ffmpeg_version:
        description: "FFmpeg version: blank = pinned default, or 'latest' / 'snapshot' / e.g. 9.0.2"
        type: string
        default: ""

# If you trigger a second run before the first finishes, cancel the old one
# instead of burning two sets of runner minutes on the same thing.
concurrency:
  group: ffmpeg-macos-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # macos-15-intel is the only GitHub-hosted runner still on real x86_64
    # hardware - macos-latest/14/15 are Apple Silicon only. Your 2015
    # MacBook Air is Intel, so this is the one that matters: an arm64
    # binary from the default runner would not run on it at all.
    runs-on: macos-15-intel
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Avoids the exact failure from the local build: if doxygen/sphinx-build
      # are on PATH, meson tries to pull an extra doc-generation subproject
      # over the network and dies on cert verification. Nothing here needs
      # docs, so just make sure neither tool is visible. Harmless no-op if
      # they're not installed on the runner.
      - name: Keep docs out of the build
        run: brew unlink doxygen sphinx-doc 2>/dev/null || true

      # Reuses already-downloaded sources and already-built libraries across
      # runs. The script itself skips any package whose pinned version
      # hasn't changed, so a warm cache turns a ~45-60 min cold build into a
      # few minutes when you're just iterating on flags.
      - name: Cache sources and build workspace
        uses: actions/cache@v4
        with:
          path: |
            packages
            workspace
          key: ffmpeg-macos-intel-${{ hashFiles('build-ffmpeg', 'src/**') }}-${{ inputs.enable_gpl_and_non_free }}-${{ inputs.disable }}-${{ inputs.ffmpeg_version }}
          restore-keys: |
            ffmpeg-macos-intel-

      - name: Build
        env:
          SKIPINSTALL: "yes" # non-interactive - the script normally prompts to install at the end
          VERBOSE: "yes"
        run: |
          ARGS="--build"
          if [ "${{ inputs.enable_gpl_and_non_free }}" = "true" ]; then
            ARGS="$ARGS --enable-gpl-and-non-free"
          fi
          if [ -n "${{ inputs.disable }}" ]; then
            ARGS="$ARGS --disable=${{ inputs.disable }}"
          fi
          if [ -n "${{ inputs.ffmpeg_version }}" ]; then
            ARGS="$ARGS --ffmpeg-version=${{ inputs.ffmpeg_version }}"
          fi
          echo "Running: ./build-ffmpeg $ARGS"
          # Heartbeat so a quiet compile step never looks stalled in the log -
          # same trick the project's own CI workflow uses.
          ( while sleep 300; do echo "=====[ ${SECONDS}s still running ]====="; done ) &
          HEARTBEAT_PID=$!
          ./build-ffmpeg $ARGS
          kill "$HEARTBEAT_PID"

      - name: Verify architecture and sanity-check the binary
        run: |
          file workspace/bin/ffmpeg workspace/bin/ffprobe workspace/bin/ffplay
          workspace/bin/ffmpeg -version | head -5

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-macos-x86_64
          path: |
            workspace/bin/ffmpeg
            workspace/bin/ffprobe
            workspace/bin/ffplay
          retention-days: 14
          if-no-files-found: error
